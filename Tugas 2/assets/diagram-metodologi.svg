<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="auto" role="img" aria-labelledby="diagTitle diagDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="diagTitle">Diagram Alur Metodologi Riset</title>
  <desc id="diagDesc">Lima tahapan metodologi riset secara berurutan: Identifikasi Masalah, Studi Literatur, Perancangan Sistem, Implementasi &amp; Pengujian, dan Analisis Hasil.</desc>

  <!-- Tahap 1 -->
  <rect x="10" y="70" width="150" height="80" rx="10" fill="#eef4ff" stroke="#0b3d91" stroke-width="2"/>
  <text x="85" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0b3d91">Identifikasi</text>
  <text x="85" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0b3d91">Masalah</text>

  <!-- Panah 1 -->
  <line x1="160" y1="110" x2="195" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tahap 2 -->
  <rect x="200" y="70" width="150" height="80" rx="10" fill="#eef4ff" stroke="#0b3d91" stroke-width="2"/>
  <text x="275" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0b3d91">Studi</text>
  <text x="275" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0b3d91">Literatur</text>

  <!-- Panah 2 -->
  <line x1="350" y1="110" x2="385" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tahap 3 -->
  <rect x="390" y="70" width="150" height="80" rx="10" fill="#eef4ff" stroke="#0b3d91" stroke-width="2"/>
  <text x="465" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0b3d91">Perancangan</text>
  <text x="465" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0b3d91">Sistem</text>

  <!-- Panah 3 -->
  <line x1="540" y1="110" x2="575" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tahap 4 -->
  <rect x="580" y="70" width="160" height="80" rx="10" fill="#eef4ff" stroke="#0b3d91" stroke-width="2"/>
  <text x="660" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0b3d91">Implementasi</text>
  <text x="660" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0b3d91">&amp; Pengujian</text>

  <!-- Panah 4 -->
  <line x1="740" y1="110" x2="775" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tahap 5 -->
  <rect x="780" y="70" width="110" height="80" rx="10" fill="#dff0d8" stroke="#3c763d" stroke-width="2"/>
  <text x="835" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3c763d">Analisis</text>
  <text x="835" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3c763d">Hasil</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
